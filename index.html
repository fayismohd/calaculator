
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link href="./src/output.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body class="min-h-screen bg-[#090D18] text-white font-['Plus_Jakarta_Sans'] flex items-center justify-center p-5">

  <main class="w-full max-w-[380px]">

    <!-- Header -->
    <header class="flex items-center justify-between mb-8">
      <div>
        <p class="text-xs font-semibold tracking-[3px] text-indigo-400 mb-2">
          DAILY TOOLS
        </p>
        <h1 class="text-2xl font-bold">Calculator</h1>
      </div>

      <div class="w-12 h-12 rounded-2xl bg-indigo-500/15 flex items-center justify-center text-indigo-400 text-2xl">
        ✦
      </div>
    </header>

    <!-- Calculator -->
    <section class="bg-[#141C2C] border border-slate-700/50 rounded-[28px] p-5 shadow-2xl">

      <!-- Display -->
     <div class="bg-[#0D1422] rounded-2xl p-5 mb-5 min-h-32 flex flex-col justify-end items-end">

  <p id="previous-value" class="text-slate-400 text-sm mb-2 min-h-5"></p>

  <h2 id="current-value" class="text-4xl font-bold tracking-wide">
    0
  </h2>

  <p class="text-xs text-emerald-400 mt-2">Ready to calculate</p>

</div>

      <!-- Buttons -->
      <div class="grid grid-cols-4 gap-3">

        <button data-action="clear" class="h-16 rounded-2xl bg-rose-500/10 text-rose-400 font-semibold hover:bg-rose-500/20 transition">AC</button>
        <button data-action="delete" class="h-16 rounded-2xl bg-slate-700/50 text-indigo-300 font-semibold hover:bg-slate-700 transition">DEL</button>
        <button data-operator="%" class="h-16 rounded-2xl bg-slate-700/50 text-indigo-300 font-semibold hover:bg-slate-700 transition">%</button>
        <button data-operator="/" class="h-16 rounded-2xl bg-indigo-500/15 text-indigo-400 text-xl font-bold hover:bg-indigo-500/25 transition">÷</button>

        <button data-number="7" class="number-btn">7</button>
        <button data-number="8" class="number-btn">8</button>
        <button data-number="9" class="number-btn">9</button>
        <button data-operator="*" class="operator-btn">×</button>

        <button data-number="4" class="number-btn">4</button>
        <button data-number="5" class="number-btn">5</button>
        <button data-number="6" class="number-btn">6</button>
        <button data-operator="-" class="operator-btn">−</button>

        <button data-number="1" class="number-btn">1</button>
        <button data-number="2" class="number-btn">2</button>
        <button data-number="3" class="number-btn">3</button>
        <button data-operator="+" class="operator-btn">+</button>

        <button data-action="clear" class="number-btn">C</button>
        <button data-number="0" class="number-btn">0</button>
        <button data-number="." class="number-btn">.</button>
        <button data-action="calculate" class="h-16 rounded-2xl bg-indigo-500 text-white text-2xl font-bold shadow-lg shadow-indigo-500/25 hover:bg-indigo-400 active:scale-95 transition">=</button>

      </div>
    </section>

    <p class="text-center text-slate-600 text-xs mt-6">
      Designed for everyday calculations
    </p>

  </main>

  <script src="./js/app.js"></script>
</body>
</html>
